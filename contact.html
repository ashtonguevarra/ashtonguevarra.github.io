  <!-- Contact Form -->
   <main>
     <div class="page">
       <div class="contact-page">
         <p class="subhead fade-in fade-in-delay-1">
           Let's get in touch! Fill out the form below or reach me through email or social media. I look forward to hearing from you!
         </p>
         <form id="contact-form" class="contact-form contact-form--centered" novalidate>
           <h3>Send a Message</h3>


           <!-- Web3Forms access key (hidden) — replace with your key -->
           <input type="hidden" name="access_key" value="45e41d08-b80f-4535-a109-d4b16f36d0c6" />


           <!-- Honey pot field to prevent spam (hidden from users) -->
           <input type="checkbox" name="botcheck" class="hidden" style="display: none;" tabindex="-1" autocomplete="off" />


           <div class="form-group">
             <label for="name">Name</label>
             <input type="text" id="name" name="name" placeholder="Your name" required />
           </div>
           <div class="form-group">
             <label for="email">Email</label>
             <input type="email" id="email" name="email" placeholder="your@email.com" required />
           </div>
           <div class="form-group">
             <label for="subject">Subject</label>
             <input type="text" id="subject" name="subject" placeholder="What's this about?" />
           </div>
           <div class="form-group">
             <label for="message">Message</label>
             <textarea id="message" name="message" placeholder="Tell me about your project or idea..." required></textarea>
           </div>
           <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
             Send Message
           </button>
           <div id="form-result" class="form-message" style="display: none;"></div>
         </form>
       </div>
     </div>
